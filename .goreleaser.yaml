version: 2

builds:
  - main: ./cmd/agent-session-switch
    binary: agent-session-switch
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
  filters:
    exclude: ['^docs', '^test', '^chore', '^ci']
